[project]
name = "massive-training-tool"
version = "0.1.0"
description = "Analyst training tools on Massive market data: dark pool / off-exchange flow (dark_pool/) and after-market event-study abnormal-return analysis (event_study/)."
requires-python = ">=3.11"
dependencies = [
  "requests",
  "python-dotenv",
  "pandas",
  "streamlit>=1.66.1",
  "plotly>=7.1.0",
  "massive>=2.3.2",
]

[dependency-groups]
dev = [
  "pytest",
  "responses",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
